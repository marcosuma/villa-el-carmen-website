[project]
name = "villa-el-carmen-website"
version = "2.0.0"
description = "Static multilingual site for Villa El Carmen (elcarmenpuglia.com)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
